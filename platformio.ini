; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build / Upload in VS Code use the 2.8" env "cyd" by default; pick "cyd35"
; for the 3.5" board (PlatformIO toolbar / "pio run -e cyd35"). The release
; env is built by tools/release.py (pio run -e cyd-release).
default_envs = cyd

; Settings shared by every board (the TFT_eSPI driver and pins are per env).
[common]
platform = espressif32@6.10.0
board = esp32dev
; Two 1.875 MB app slots for OTA updates (net/ota_updater). NVS stays at
; 0x9000 like in huge_app.csv, so settings survive the switch.
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@1.1.0
    bblanchon/ArduinoJson@^7.4.3
build_flags =
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1   ; touch handled by src/ui/touch_input, not TFT_eSPI
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; ESP32-2432S028R, 2.8" ILI9341 320 x 240 (include/boards/cyd28.h)
[env:cyd]
extends = common
build_flags =
    ${common.build_flags}
    -DBOARD_CYD28=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000

; ESP32-3248S035R, 3.5" ST7796 480 x 320, touch on the TFT bus
; (include/boards/cyd35.h). Not yet checked on a real board.
[env:cyd35]
extends = common
build_flags =
    ${common.build_flags}
    -DBOARD_CYD35=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_BL=27
    -DSPI_FREQUENCY=40000000

; Firmware published for OTA and the web installer (tools/release.py). Built
; without include/secrets.h, so the published binary has no WiFi password; the
; device joins the network chosen on its WiFi screen.
[env:cyd-release]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DRELEASE_BUILD=1

; 3.5" release (tools/release.py), like cyd-release.
[env:cyd35-release]
extends = env:cyd35
build_flags =
    ${env:cyd35.build_flags}
    -DRELEASE_BUILD=1
